<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoreNull — House</title>
  <style>
    /* ── 탭 기본 스타일 ───────────────────────────────────────────── */
    #tab-nav {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--color-border-tertiary, #e0e0e0);
      overflow-x: auto;
    }

    .tab-btn {
      padding: 8px 18px;
      border: 0.5px solid var(--color-border-secondary, #ccc);
      border-radius: 20px;
      background: none;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      color: var(--color-text-secondary, #666);
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn.active {
      background: var(--color-text-primary, #111);
      color: var(--color-background-primary, #fff);
      border-color: transparent;
    }

    .tab-content {
      display: none;
      padding: 16px;
    }

    .tab-content.active {
      display: block;
    }

    /* ── 라이트박스 오버레이 ─────────────────────────────────────── */
    /* JS 모듈이 없는 환경을 위한 최소 스타일만 선언.
       실제 스타일은 lightbox.js 가 동적으로 설정함.            */
    #lightbox {
      display: none;
    }

    /* ── Confirm 오버레이 ────────────────────────────────────────── */
    #confirmOverlay {
      display: none;
    }
  </style>
</head>
<body>

  <!-- ── 탭 네비게이션 (버튼은 tabs.js 가 buildTabs() 로 생성) ──── -->
  <nav id="tab-nav" aria-label="섹션 탭"></nav>

  <!-- ── 탭 콘텐츠 패널 (tabs.js 가 필요시 동적 생성) ────────────── -->
  <div id="tab-contents">
    <div id="tab-lobby"   class="tab-content" role="tabpanel"></div>
    <div id="tab-library" class="tab-content" role="tabpanel"></div>
    <!-- 방 탭 패널은 buildTabs() 가 동적으로 추가함 -->
  </div>

  <!-- ── 라이트박스 (lightbox.js 가 마운트, 구조는 JS 에서 생성) ── -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="이미지 뷰어"></div>

  <!-- ── Confirm 다이얼로그 (confirm.js 가 마운트) ─────────────────── -->
  <div id="confirmOverlay" role="alertdialog" aria-modal="true"
       aria-labelledby="confirm-title" aria-describedby="confirm-sub"></div>

  <!--
    ═══════════════════════════════════════════════════════════════
    ⚠️  house.html 컨테이너 계약 (Master v1.0 §3 / §6)

    이 파일은 layout + routing 만 담당합니다.
    아래 함수는 절대 이 파일에 작성하지 마세요:

      ✗  openLightbox / lbGoTo / lbPrev / lbNext / closeLightbox
             → public/js/ui/lightbox.js  (MODULE-CN-18)

      ✗  buildTabs / switchTab / switchToRoomType
             → public/js/ui/tabs.js  (MODULE-CN-03)

      ✗  openConfirm / closeConfirm
             → public/js/ui/confirm.js  (MODULE-CN-19)

    비즈니스 로직이 필요하면 해당 모듈을 import 하세요.
    ═══════════════════════════════════════════════════════════════
  -->

  <!-- ── 모듈 진입점 ──────────────────────────────────────────────── -->
  <script type="module">
    import { state }                        from './public/js/common.js';
    import { loadHouseData }                from './public/js/api.js';
    import { buildTabs, switchTab }         from './public/js/ui/tabs.js';
    import { openLightbox, closeLightbox }  from './public/js/ui/lightbox.js';
    import { openConfirm, closeConfirm }    from './public/js/ui/confirm.js';
    import { renderLobby }                  from './public/tabs/living.js';
    import { renderRoom }                   from './public/tabs/room.js';
    import { renderLibrary }                from './public/tabs/library.js';

    // ── 전역 노출 (하위 모듈에서 window.* 로 호출하는 경우 대응) ──
    // 점진적 마이그레이션 기간 동안만 유지. 완료 후 제거할 것.
    window.openLightbox  = openLightbox;
    window.closeLightbox = closeLightbox;
    window.openConfirm   = openConfirm;
    window.closeConfirm  = closeConfirm;
    window.switchTab     = switchTab;

    // ── 초기화 ──────────────────────────────────────────────────────
    async function init() {
      await loadHouseData();
      buildTabs(state.rooms, { renderLobby, renderRoom, renderLibrary });
    }

    init();
  </script>

</body>
</html>
